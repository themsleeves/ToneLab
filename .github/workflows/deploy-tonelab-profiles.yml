name: Deploy ToneLab Profiles

on:
  push:
    branches:
      - main
    paths:
      - 'tools/tonelab-profiles/**'
      - '.github/workflows/deploy-tonelab-profiles.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'tonelab-profiles-pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: tools/tonelab-profiles

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: tools/tonelab-profiles/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload application
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/tonelab-profiles/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4